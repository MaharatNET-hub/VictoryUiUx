<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Victory B2B — شبكة التوريد الذكية</title>
<link rel="icon" href="assets/logo-mark.png" />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px;
       background:radial-gradient(1200px 700px at 50% -10%,#123A6B 0%,#050E1C 60%);
       font-family:'Cairo',system-ui,sans-serif;color:#fff}
  a{text-decoration:none;color:inherit}
  .wrap{width:100%;max-width:760px;text-align:center}
  .mark{width:96px;height:96px;object-fit:contain;display:block;margin:0 auto}
  .word{font-family:'Montserrat',sans-serif;font-size:26px;font-weight:800;letter-spacing:.18em;margin-top:14px}
  .rule{display:flex;align-items:center;gap:12px;width:200px;margin:20px auto 0}
  .rule span{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28))}
  .dot{width:6px;height:6px;border-radius:50%;background:#F4761F;flex:none}
  .sub{font-size:14px;color:#AFC9EC;margin-top:18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:34px}
  .card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);border-radius:20px;
        padding:26px 22px;text-align:right;transition:background .2s,border-color .2s,transform .2s}
  .card:hover{background:rgba(255,255,255,.10);border-color:rgba(46,155,240,.5);transform:translateY(-3px)}
  .badge{display:inline-block;font-size:11px;font-weight:800;padding:5px 11px;border-radius:20px}
  .b1{background:rgba(46,155,240,.18);color:#9FD0FA}
  .b2{background:rgba(244,118,31,.18);color:#FFC08A}
  .t{font-size:19px;font-weight:800;margin-top:14px}
  .d{font-size:12.5px;color:#AFC9EC;margin-top:9px;line-height:1.9}
  .go{display:flex;align-items:center;gap:8px;margin-top:18px;font-size:13px;font-weight:800;color:#F4761F}
  .chev{width:7px;height:7px;border-top:2px solid #F4761F;border-left:2px solid #F4761F;transform:rotate(-45deg)}
  .foot{font-family:'Montserrat',sans-serif;font-size:10px;color:#5C7396;letter-spacing:.26em;margin-top:40px}
</style>
</head>
<body>
<div class="wrap">
  <img class="mark" src="assets/logo-mark.png" alt="Victory" />
  <div class="word">VICTORY</div>
  <div class="rule"><span></span><div class="dot"></div><span></span></div>
  <div class="sub">شبكة التوريد الذكية — اختر التطبيق</div>

  <div class="grid">
    <a class="card" href="merchant.html">
      <div class="badge b1">تاجر</div>
      <div class="t">تطبيق التاجر</div>
      <div class="d">تصفّح المنتجات والموردين، اطلب النواقص، تابع الطلبات والائتمان والتقارير.</div>
      <div class="go">افتح التطبيق<div class="chev"></div></div>
    </a>
    <a class="card" href="supplier.html">
      <div class="badge b2">مورد</div>
      <div class="t">تطبيق المورد</div>
      <div class="d">استقبل الطلبات، أدر كتالوغ منتجاتك وأسعارك ومخزونك، وتابع المدفوعات.</div>
      <div class="go">افتح التطبيق<div class="chev"></div></div>
    </a>
  </div>

  <div class="foot">B2B NETWORK</div>
</div>
</body>
</html>
